<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f9">
  <title>服务文档</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <main class="docs-shell">
    <div class="docs-heading">
      <h1>服务文档</h1>
      <a class="back-link" href="/">返回数据目录</a>
    </div>
    <div class="docs-layout">
      <nav class="docs-toc" aria-label="文档目录">
        <p class="toc-title">本页目录</p>
        <div class="toc-links" id="doc-links"></div>
      </nav>
      <article class="doc-content" id="document" aria-live="polite">
        <p>正在读取文档</p>
      </article>
    </div>
  </main>
  <script>
    const escapeHTML = (value) => value.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const inline = (value) => escapeHTML(value)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

    function renderMarkdown(source) {
      const output = [];
      const lines = source.split(/\r?\n/);
      let paragraph = [];
      let list = false;
      let code = false;
      let codeLines = [];
      let sectionIndex = 0;
      const flushParagraph = () => {
        if (paragraph.length) output.push(`<p>${inline(paragraph.join(" "))}</p>`);
        paragraph = [];
      };
      const closeList = () => {
        if (list) output.push("</ul>");
        list = false;
      };

      for (const line of lines) {
        if (line.startsWith("```")) {
          flushParagraph(); closeList();
          if (code) output.push(`<pre><code>${escapeHTML(codeLines.join("\n"))}</code></pre>`);
          code = !code; codeLines = [];
          continue;
        }
        if (code) { codeLines.push(line); continue; }
        const heading = /^(#{1,3})\s+(.+)$/.exec(line);
        if (heading) {
          flushParagraph(); closeList();
          const level = Math.min(heading[1].length, 2);
          const anchor = /\s+\{#([a-z0-9-]+)\}$/.exec(heading[2]);
          const title = anchor ? heading[2].slice(0, anchor.index) : heading[2];
          const id = anchor?.[1] || `section-${sectionIndex}`;
          if (level === 2) sectionIndex++;
          output.push(`<h${level} id="${id}">${inline(title)}</h${level}>`);
        } else if (/^[-*]\s+/.test(line)) {
          flushParagraph();
          if (!list) { output.push("<ul>"); list = true; }
          output.push(`<li>${inline(line.replace(/^[-*]\s+/, ""))}</li>`);
        } else if (!line.trim()) {
          flushParagraph(); closeList();
        } else {
          closeList(); paragraph.push(line.trim());
        }
      }
      flushParagraph(); closeList();
      if (code) output.push(`<pre><code>${escapeHTML(codeLines.join("\n"))}</code></pre>`);
      return output.join("\n");
    }

    fetch("/docs/handoff.md", { cache: "no-store" })
      .then((response) => { if (!response.ok) throw new Error(); return response.text(); })
      .then((markdown) => {
        document.querySelector("#document").innerHTML = renderMarkdown(markdown);
        const links = document.querySelector("#doc-links");
        for (const heading of document.querySelectorAll("#document h2")) {
          const link = document.createElement("a");
          link.className = "toc-link";
          link.href = `#${heading.id}`;
          link.textContent = heading.textContent;
          links.append(link);
        }
      })
      .catch(() => { document.querySelector("#document").innerHTML = '<p class="doc-error">暂时无法读取服务文档</p>'; });
  </script>
</body>
</html>
