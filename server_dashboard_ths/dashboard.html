<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f9">
  <title>评测数据</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="dashboard-top">
      <div class="dataset-range" id="dataset-range" aria-live="polite">
        <span class="dataset-range-dates" id="dataset-range-dates">读取中</span>
        <span class="dataset-range-separator" aria-hidden="true">·</span>
        <span class="dataset-range-models">4 个模型</span>
      </div>
      <div class="top-actions">
        <div class="service-state" id="service-state" role="status" aria-live="polite">
          <span class="state-dot" aria-hidden="true"></span>
          <span class="state-label">连接中</span>
        </div>
        <a class="docs-link" href="/docs">文档</a>
      </div>
    </header>

    <section class="catalog" aria-label="日期数据与评测进度">
      <div class="catalog-toolbar">
        <div class="catalog-summary" aria-live="polite">
          <span class="summary-number" id="ready-count">—</span>
          <span class="summary-label">有数据日期</span>
          <span class="summary-divider" aria-hidden="true"></span>
          <span class="summary-number" id="total-rows">—</span>
          <span class="summary-label">条记录</span>
        </div>
        <button class="refresh-button" id="refresh" type="button" aria-label="刷新数据">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 7.5A6.5 6.5 0 0 0 4.3 6L3 7.5m0 0V4.2m0 3.3h3.3M4 12.5A6.5 6.5 0 0 0 15.7 14l1.3-1.5m0 0v3.3m0-3.3h-3.3"/></svg>
        </button>
      </div>
      <div class="table-scroll" tabindex="0" aria-label="按日期查看模型数据和评测进度，可横向滚动">
        <table class="results-table">
          <caption class="sr-only">每日 A Fast 与 B组 Fast、A Expert 与 B组 Expert 配对数据和评测进度</caption>
          <thead>
            <tr>
              <th class="date-column" scope="col">日期</th>
              <th scope="col">A Fast 对 B组 Fast<span class="pair-quota"></span><span class="quota-policy">超过评测配额，不评测</span></th>
              <th scope="col">A Expert 对 B组 Expert<span class="pair-quota"></span><span class="quota-policy">超过评测配额，不评测</span></th>
            </tr>
          </thead>
          <tbody id="date-rows">
            <tr><td class="loading-cell" colspan="3">读取中</td></tr>
          </tbody>
        </table>
      </div>
      <nav class="date-pagination" id="date-pagination" aria-label="日期分页" hidden>
        <button class="page-button" id="previous-page" type="button" aria-label="查看较新的日期" disabled>上一页</button>
        <span class="page-summary" id="page-summary" aria-live="polite"></span>
        <button class="page-button" id="next-page" type="button" aria-label="查看较早的日期" disabled>下一页</button>
      </nav>
    </section>
    <p class="connection-error" id="connection-error" role="alert" hidden></p>
  </main>
</body>
</html>
