<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f9">
  <title>问句列表</title>
  <link rel="stylesheet" href="__BASE__/dashboard.css">
  <script src="__BASE__/records.bundle.js" defer></script>
</head>
<body>
  <main class="records-shell">
    <header class="records-header">
      <a class="back-link" href="__BASE__/">← 数据目录</a>
      <h1 id="records-title">读取中</h1>
      <span id="records-count" class="records-count"></span>
    </header>
    <div id="records-list" class="records-list" aria-live="polite">
      <p class="records-message">读取中</p>
    </div>
    <nav class="records-pagination" aria-label="样本分页">
      <button id="previous-page" type="button" disabled>上一页</button>
      <span id="page-status">—</span>
      <button id="next-page" type="button" disabled>下一页</button>
    </nav>
  </main>
</body>
</html>
