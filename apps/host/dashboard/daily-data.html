<!doctype html><html lang="zh-CN"><body><main class="daily-data">
  <div class="daily-data-toolbar"><div class="daily-tabs nav nav-tabs" role="tablist" aria-label="数据来源"><button id="data-source-wencai" class="nav-link active" type="button" role="tab" aria-controls="data-table-panel" aria-selected="true" data-data-source="wencai">问财日常四路</button><button id="data-source-aime" class="nav-link" type="button" role="tab" aria-selected="false" tabindex="-1" data-data-source="aime">AIME 日常全量</button></div><label>日期<input id="data-date" class="form-control" type="date"></label><button id="data-date-clear" class="button" type="button">全部日期</button><button id="data-results" class="button" type="button">查看结果</button><button id="data-refresh" class="button" type="button">刷新</button></div>
  <div class="daily-data-meta"><span id="data-summary" role="status"></span><span id="data-loading" role="status" hidden>读取中</span></div><p id="data-error" class="error" role="alert" hidden></p>
  <section id="data-table-panel" class="daily-table-workspace" role="tabpanel" aria-labelledby="data-source-wencai"><div class="table-scroll daily-fill-table"><table class="table table-vcenter daily-dates-table"><thead><tr><th scope="col">日期</th><th id="data-fast-heading" scope="col">Fast · A / AA</th><th id="data-expert-heading" scope="col">Expert · A / AA</th></tr></thead><tbody id="data-date-rows"></tbody></table></div>
  <nav class="daily-pagination" aria-label="日期数据分页"><label>每页<select id="data-page-size"><option>10</option><option>20</option><option>50</option></select></label><span id="data-page"></span><button id="data-prev" class="button" type="button">上一页</button><button id="data-next" class="button" type="button">下一页</button></nav></section>
  <dialog id="data-sample-dialog" class="workspace-dialog" aria-labelledby="data-sample-title"><header class="workspace-dialog-header"><h2 id="data-sample-title"></h2><button id="data-sample-close" class="button" type="button">关闭</button></header><div id="data-sample-content" class="workspace-dialog-body"></div></dialog>
</main></body></html>
