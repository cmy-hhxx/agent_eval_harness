<!doctype html><html lang="zh-CN"><body>
<main class="intake">
  <div class="intake-toolbar">
    <label>评测类型<select id="intake-category"><option value="">全部</option><option value="daily">日常</option><option value="task">专项</option></select></label>
    <label>来源<select id="intake-source"><option value="">全部</option><option value="wencai">wencai</option><option value="aime">AIME</option><option value="ifind">ifind</option></select></label>
    <label>任务<select id="intake-task"><option value="">全部任务</option></select></label>
    <label class="intake-check"><input id="intake-unassigned" type="checkbox">待归属</label>
    <button class="button" id="intake-refresh" type="button">刷新</button>
    <button class="button" id="intake-new" type="button">新建任务</button>
  </div>
  <form id="intake-create" class="intake-toolbar" hidden>
    <label>任务名称<input id="task-name" required maxlength="120"></label>
    <label>来源<select id="task-source"><option value="wencai">wencai</option><option value="aime">AIME</option><option value="ifind">ifind</option></select></label>
    <label>评测类型<select id="task-category"><option value="task">专项</option><option value="daily">日常</option></select></label>
    <label>输入模型组<select id="task-profile"><option value="wencai">问财四模型</option><option value="post_training_model">后训练双模型</option></select></label>
    <button class="button button-primary" type="submit">创建任务</button>
    <button class="button" id="task-cancel" type="button">取消</button>
  </form>
  <p id="intake-error" class="error" role="alert" hidden></p>
  <p id="intake-task-path" class="intake-path" hidden></p>
  <p id="intake-status" role="status" aria-live="polite"></p>
  <div class="intake-toolbar">
    <span id="intake-selected">已选 0 个批次</span>
    <label>归入任务<select id="intake-assign-task"><option value="">选择任务</option></select></label>
    <button class="button" id="intake-assign" type="button" disabled>归入任务</button>
    <button class="button button-primary" id="intake-clean" type="button" disabled>清洗所选批次</button>
    <button class="button button-primary" id="intake-evaluate" type="button" disabled>评测所选批次</button>
    <button class="button" id="intake-browse" type="button" disabled>查看任务样本</button>
  </div>
  <div class="table-scroll"><table>
    <thead><tr><th><input id="intake-all" type="checkbox" aria-label="选择本页全部批次"></th><th>压缩包批次</th><th>任务</th><th>状态</th><th class="intake-number">读入记录</th><th class="intake-number">纳入回答</th><th class="intake-number">排除记录</th><th>操作</th></tr></thead>
    <tbody id="intake-rows"></tbody>
  </table></div>
  <nav class="intake-toolbar" aria-label="批次分页"><button class="button" id="intake-prev" type="button" disabled>上一页</button><span id="intake-page"></span><button class="button" id="intake-next" type="button" disabled>下一页</button></nav>
  <section id="intake-report" hidden aria-label="清洗报告">
    <h2 id="report-title"></h2><p id="report-path" class="intake-path"></p><p id="report-counts" role="status"></p>
    <div id="report-reasons"></div><p id="report-failure" class="error" hidden></p>
    <div class="intake-toolbar"><label>明细<select id="report-section"><option value="exclusions">排除记录</option><option value="records">纳入回答</option><option value="metadata_issues">标签与效率异常</option></select></label></div>
    <div class="table-scroll"><table><thead><tr><th>模型</th><th>样本</th><th>原始文件</th><th>行 / 项</th><th>原因 / 操作</th></tr></thead><tbody id="report-rows"></tbody></table></div>
    <nav class="intake-toolbar" aria-label="报告分页"><button class="button" id="report-prev" type="button">上一页</button><span id="report-page"></span><button class="button" id="report-next" type="button">下一页</button></nav>
  </section>
  <section id="intake-sample" hidden aria-label="样本详情"><h2 id="sample-title"></h2><p id="sample-location" class="intake-path"></p><h3>问题</h3><pre id="sample-question"></pre><h3>回答</h3><pre id="sample-answer"></pre></section>
</main></body></html>
