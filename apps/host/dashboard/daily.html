<!doctype html><html lang="zh-CN"><body><main class="daily-workspace">
  <div class="daily-heading"><span id="daily-requests-total" role="status" aria-live="polite"></span><button id="daily-refresh" class="button" type="button">刷新</button></div>
  <p id="daily-error" class="error" role="alert" hidden></p>
  <div class="table-scroll"><table class="daily-sources"><thead><tr><th>日常评测</th><th>状态</th><th>待评任务</th><th>已完成</th><th>失败</th><th>实际请求 / 等待</th><th>LLM 并发</th><th>操作</th></tr></thead><tbody id="daily-source-rows"></tbody></table></div>
  <section id="daily-detail" hidden>
    <h2 id="daily-title"></h2><dl id="daily-paths" class="daily-facts"></dl><p id="daily-source-error" class="error" role="alert" hidden></p>
    <section id="daily-aime-coverage" hidden><p id="daily-aime-counts" role="status"></p><div id="daily-aime-model-table" class="table-scroll" hidden><table><thead><tr><th>模式</th><th>纳入回答</th><th>完整完成</th><th>失败</th><th>待评</th></tr></thead><tbody id="daily-aime-model-rows"></tbody></table></div></section>
    <details id="daily-settings"><summary>执行配置</summary><section id="daily-active-settings" hidden><h3>当前执行配置</h3><dl id="daily-active-values" class="daily-facts"></dl></section><h3 id="daily-settings-heading">执行配置</h3><form id="daily-settings-form">
      <div class="daily-settings-grid"><label>运行引擎<select id="daily-engine"><option value="pi">Pi</option><option value="prime">Prime</option></select></label>
      <label>任务超时（秒）<input id="daily-timeout" type="number" min="1" required></label><label>工具调用上限<input id="daily-tools" type="number" min="1" required></label><label>传输重试次数<input id="daily-retries" type="number" min="0" required></label><label>提交修正次数<input id="daily-repairs" type="number" min="0" required></label><label>任务尝试上限<input id="daily-attempts" type="number" min="1"></label><label>重试间隔（秒）<input id="daily-retry-delay" type="number" min="0" required></label></div>
      <div id="daily-bindings" class="daily-bindings"></div><div id="daily-rewrites" class="daily-checks"></div>
      <div class="daily-settings-actions"><label><input id="daily-debug" type="checkbox"> 保存 Debug 材料</label><button class="button" type="submit">保存配置</button><output id="daily-settings-status" role="status"></output></div>
    </form></details>
    <h3>阶段进度</h3><div id="daily-stages" class="daily-stages"></div>
    <section id="daily-mongo" hidden><h3>MongoDB</h3><p id="daily-mongo-status"></p></section>
    <h3>数据包</h3><div class="table-scroll"><table><thead><tr><th>数据包</th><th>状态</th><th>纳入 / 排除</th><th>错误</th><th>操作</th></tr></thead><tbody id="daily-package-rows"></tbody></table></div>
    <nav class="daily-pagination" aria-label="数据包分页"><button id="daily-package-prev" class="button" type="button">上一页</button><span id="daily-package-page"></span><button id="daily-package-next" class="button" type="button">下一页</button></nav>
    <section id="daily-package-report" hidden><h3 id="daily-report-title"></h3><p id="daily-report-summary" role="status"></p><div id="daily-report-file-errors" class="error"></div><p id="daily-report-error" class="error" role="alert" hidden></p>
      <div class="intake-toolbar"><label>明细<select id="daily-report-section"><option value="records">纳入回答</option><option value="exclusions">排除记录</option><option value="metadata_issues">元数据异常</option></select></label></div>
      <div class="table-scroll"><table><thead><tr><th>模型 / Case</th><th>原包成员 / 行 / 项</th><th>评测覆盖 / 原因</th><th>运行结果</th></tr></thead><tbody id="daily-report-rows"></tbody></table></div>
      <nav class="daily-pagination" aria-label="包报告分页"><button id="daily-report-prev" class="button" type="button">上一页</button><span id="daily-report-page"></span><button id="daily-report-next" class="button" type="button">下一页</button></nav>
    </section>
    <h3>运行</h3><div class="table-scroll"><table><thead><tr><th>日期 / run</th><th>状态</th><th>完成 / 总数</th><th>操作</th></tr></thead><tbody id="daily-run-rows"></tbody></table></div>
  </section>
  <section id="daily-request-section"><h2>正在调用 LLM</h2><div class="table-scroll"><table><thead><tr><th>来源</th><th>阶段</th><th>模型 / 渠道</th><th>开始时间</th><th>任务</th></tr></thead><tbody id="daily-request-rows"></tbody></table></div></section>
</main></body></html>
