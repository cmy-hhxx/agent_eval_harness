<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>问题库 · 评测工作台</title>
  <link rel="stylesheet" href="/dashboard.css" />
  <link rel="stylesheet" href="/problems.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="工作台导航">
      <nav class="workspace-nav" aria-label="工作台导航"><a href="/">运行工作台</a><a href="/reference">数据与流程</a><a href="/problems" aria-current="page">问题库</a></nav>
    </aside>
    <main class="main-content problems-page" aria-label="问题库">
      <div class="problem-page-actions"><span id="problem-updated" class="problem-updated"></span><button id="problem-refresh" class="button problem-refresh" type="button"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 7a6.5 6.5 0 1 0 .3 5M16 7V3m0 4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>刷新</button></div>
      <div id="problem-error" class="error-banner" role="alert" hidden></div>
      <div id="problem-models" class="problem-models" role="tablist" aria-label="模型问题库"><span class="loading" role="status" aria-label="正在读取问题库"><span class="spinner" aria-hidden="true"></span></span></div>
      <section id="problem-workspace" class="problem-workspace" role="tabpanel" aria-label="模型问题库" tabindex="-1">
        <div class="problem-tree-panel">
          <div class="problem-tree-toolbar"><label class="problem-search" for="problem-search"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5" stroke="currentColor" stroke-width="1.5" /><path d="m12 12 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg><span>搜索问题类</span><input id="problem-search" type="search" aria-label="搜索问题类" autocomplete="off" /><button id="problem-search-clear" type="button" aria-label="清空搜索" hidden>×</button></label></div>
          <div id="problem-tree" class="problem-tree" role="tree" aria-label="模型、组件与问题类"></div>
          <div id="problem-tree-result" class="problem-tree-result" role="status" aria-live="polite"></div>
          <div id="problem-merges" class="problem-merges"></div>
        </div>
        <article id="problem-detail" class="problem-detail" aria-live="polite" aria-busy="false"><span class="loading" role="status" aria-label="正在读取问题库"><span class="spinner" aria-hidden="true"></span></span></article>
      </section>
    </main>
  </div>
  <script type="module" src="/problems.js"></script>
</body>
</html>
