<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自动化错误日志</title>
  <link rel="stylesheet" href="/runtime/automation-assets/dashboard.css">
  <link rel="stylesheet" href="/runtime/automation-assets/automations.css">
  <script src="/automation-errors.js" defer></script>
</head>
<body class="automation-page">
  <main>
    <header class="page-header">
      <h1 id="page-title">错误日志</h1>
      <div class="monitor-actions"><a class="button" href="/">工作台</a><a class="button" href="/runtime/runs/">运行实例</a><a class="button" href="/runtime/problems">问题库</a><a class="button" href="/runtime/reference">数据与流程</a><a id="monitor-link" class="button" href="/runtime/">返回监控</a><a class="button" href="/logout">退出</a><button id="refresh" class="button" type="button">刷新</button></div>
    </header>
    <div class="monitor-meta"><span id="error-total"></span><span id="sample-time"></span></div>
    <div id="connection-error" class="error-banner" role="alert" hidden></div>
    <div class="monitor-filters">
      <label>数据日期 <select id="date-filter"><option value="">全部日期</option></select></label>
      <label>记录时间 <select id="time-filter"><option value="24">近 24 小时</option><option value="168">近 7 天</option><option value="all">全部时间</option></select></label>
    </div>
    <section>
      <div id="error-records" class="table-scroll" tabindex="0" role="region" aria-label="逐条错误详情">
        <table class="data-table error-table"><thead><tr><th scope="col">记录时间</th><th scope="col">数据日期 / 任务</th><th scope="col">原始报错</th></tr></thead><tbody id="error-rows"></tbody></table>
      </div>
      <nav id="pagination" class="table-pagination" aria-label="错误日志分页" hidden>
        <span id="page-range" aria-live="polite"></span><div class="page-controls"><button id="previous" class="button" type="button">上一页</button><span id="page-number"></span><button id="next" class="button" type="button">下一页</button></div>
      </nav>
    </section>
  </main>
</body>
</html>
