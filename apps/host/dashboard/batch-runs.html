<!doctype html><html lang="zh-CN"><body><main class="intake">
<section id="batch-launch" hidden><h2>批次评测预检</h2><p id="batch-selection"></p>
<form id="batch-launch-form"><div class="intake-toolbar">
<label>并发<input id="batch-concurrency" type="number" min="1" value="8" required></label>
<button class="button" type="submit" id="batch-preview">预检所选批次</button>
<button class="button button-primary" type="button" id="batch-start" disabled>开始评测</button>
</div></form><p id="batch-preview-summary" role="status"></p><p id="batch-evaluator"></p><p id="batch-output" class="intake-path"></p></section>
<p id="batch-error" class="error" role="alert" hidden></p>
<div class="intake-toolbar"><h2>批次运行</h2><button class="button" id="batch-refresh" type="button">刷新</button></div>
<div class="table-scroll"><table><thead><tr><th>任务 / run</th><th>状态</th><th>接受 / 运行 / 待处理</th><th>失败 / 阻塞</th><th>操作</th></tr></thead><tbody id="batch-run-rows"></tbody></table></div>
<section id="batch-errors" hidden><h2 id="batch-errors-title">运行错误</h2><div class="intake-toolbar">
<label>阶段<select id="batch-stage"><option value="">全部阶段</option><option value="criteria">共同基准</option><option value="attribution">回答归因</option><option value="comparison">对比</option><option value="rewrite">改写</option><option value="clustering">聚类</option></select></label>
<label>样本<input id="batch-case" type="search"></label><label class="intake-check"><input id="batch-history" type="checkbox">包含已恢复历史</label>
</div><p id="batch-error-count" role="status"></p><div id="batch-paused"></div>
<div class="table-scroll"><table><thead><tr><th>样本 / 原始位置</th><th>阶段 / 执行任务</th><th>状态 / 尝试</th><th>错误 / 依赖</th><th>操作</th></tr></thead><tbody id="batch-error-rows"></tbody></table></div>
<h3>错误历史</h3><div id="batch-error-history"></div>
<nav class="intake-toolbar" aria-label="错误分页"><button class="button" id="batch-error-prev" type="button">上一页</button><span id="batch-error-page"></span><button class="button" id="batch-error-next" type="button">下一页</button></nav>
</section></main></body></html>
