<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>评测工作台</title>
    <link rel="stylesheet" href="/runtime/run-assets/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="运行导航">
        <nav class="workspace-nav" aria-label="工作台导航"><a href="/">工作台</a><a href="/runtime/">运行时</a><a href="/runtime/runs/" aria-current="page">运行实例</a><a href="/runtime/reference">数据与流程</a><a href="/runtime/problems">问题库</a><a href="/data/">数据</a><a href="/logout">退出</a></nav>
        <div class="sidebar-heading"><h2>运行</h2><button id="refresh-button" class="button button-quiet" type="button">刷新</button></div>
        <div id="run-list" class="run-list" aria-live="polite"><span class="loading" role="status" aria-label="正在读取运行"><span class="spinner" aria-hidden="true"></span></span></div>
      </aside>

      <main class="main-content" aria-label="评测工作台">
        <header class="page-header">
          <div class="header-meta"><span id="refresh-time"></span><span class="service-badge">本机</span></div>
        </header>
        <div id="error-banner" class="error-banner" role="alert" hidden></div>

        <details class="panel launch-panel" id="config" aria-labelledby="config-title" open>
          <summary class="panel-heading"><h2 id="config-title">新建评测</h2><div id="env-status" class="env-status" aria-label="网关配置状态"></div></summary>
          <form id="start-form" class="start-form">
            <div class="field-row date-field">
              <div class="date-selection"><div class="date-columns" aria-hidden="true"><span>日期</span><span>可评测 / 总数</span></div><div id="date-options" class="date-options" role="group" aria-label="日期"><span class="loading" role="status" aria-label="正在读取日期"><span class="spinner" aria-hidden="true"></span></span></div></div>
              <div class="field-actions"><button id="date-all" type="button">全部</button><button id="date-none" type="button">清空</button></div>
            </div>
            <div class="field-row">
              <span class="field-label">模型</span>
              <div id="model-options" class="chip-row" role="group" aria-label="模型"><span class="loading" role="status" aria-label="正在读取模型"><span class="spinner" aria-hidden="true"></span></span></div>
              <div class="field-actions"><button id="model-all" type="button">全部</button><button id="model-none" type="button">清空</button></div>
            </div>
            <div class="launch-row">
              <div class="sample-field"><span class="inline-field-label">抽样数量</span><div class="sample-control" role="group" aria-label="抽样数量"><span class="sample-input"><input id="sample-size" type="number" min="1" inputmode="numeric" value="10" aria-label="指定抽样数量" /><span aria-hidden="true">个</span></span><button id="sample-all" class="sample-mode" type="button" aria-pressed="false">全部</button></div></div>
              <label class="inline-field seed-field"><span>Seed</span><input id="sample-seed" type="number" min="0" max="4294967295" step="1" inputmode="numeric" value="41" aria-label="抽样 Seed" /></label>
              <label class="inline-field"><span>底座</span><select id="engine"><option value="pi">Pi</option><option value="prime">Prime</option></select></label>
              <button id="preview-button" class="button" type="button">预检</button>
              <button id="launch-button" class="button button-primary" type="submit" disabled>启动</button>
            </div>
            <div id="preview-result" class="preview-result" role="status" aria-live="polite"></div>
            <details class="advanced-settings">
              <summary>高级设置</summary>
              <div class="advanced-grid">
              <div class="settings-section"><h3>阶段模型</h3><div id="model-fields" class="model-fields"><span class="loading" role="status" aria-label="正在读取配置"><span class="spinner" aria-hidden="true"></span></span></div></div>
              <div class="settings-controls">
              <div class="settings-section"><h3>执行预算</h3><div class="budget-grid">
                <label><span>并发数</span><input id="setting-concurrency" type="number" min="1" required /></label>
                <label><span>任务超时（秒）</span><input id="setting-timeout" type="number" min="1" required /></label>
                <label><span>工具调用上限</span><input id="setting-tools" type="number" min="1" required /></label>
                <label><span>传输重试次数</span><input id="setting-retries" type="number" min="0" required /></label>
              </div></div>
              <div class="settings-section"><h3>处理选项</h3><div class="settings-checks">
                <label><input id="rewrite-attribution" type="checkbox" /> 改写归因评语</label>
                <label><input id="rewrite-comparison" type="checkbox" /> 改写对比评语</label>
                <label><input id="rewrite-clustering" type="checkbox" /> 改写聚类描述</label>
                <label><input id="clustering-enabled" type="checkbox" /> 维护问题库（聚类）</label>
                <label><input id="debug" type="checkbox" /> 保存 Debug 材料</label>
              </div></div>
              </div></div>
              <p id="config-path" class="config-path"></p>
            </details>
          </form>
        </details>

        <section class="run-overview" id="run-overview" hidden>
          <div class="overview-head">
            <div class="overview-title"><h2 id="run-title"></h2><span id="run-status" class="status-chip"></span></div>
            <p id="run-description"></p>
            <div class="overview-actions" id="run-actions"></div>
          </div>
          <div id="stage-summary" class="stage-summary"></div>
          <details id="clustering-panel" class="problem-library">
            <summary>聚类详情</summary>
            <div id="clustering-tasks"></div>
          </details>
          <a class="library-workspace-link" href="/runtime/problems">问题库 <span aria-hidden="true">↗</span></a>
        </section>

        <section class="explorer" id="explorer" hidden>
          <div class="panel cases-panel">
            <div class="panel-heading"><h2>样本</h2><span id="case-count" class="muted"></span></div>
            <div id="case-list" class="case-list" aria-live="polite"></div>
            <div class="pager"><button id="prev-page" class="button" type="button" disabled>上一页</button><span id="page-label">—</span><button id="next-page" class="button" type="button" disabled>下一页</button></div>
          </div>
          <div class="panel detail-panel">
            <div id="case-detail" class="case-detail" aria-live="polite"></div>
          </div>
        </section>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </main>
    </div>
    <dialog id="delete-dialog" class="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-scope">
      <form id="delete-form">
        <h2 id="delete-title">删除运行</h2>
        <p id="delete-run-label"></p>
        <p id="delete-scope">删除该运行的评测输出、状态、Debug 材料和运行日志。此操作无法恢复。</p>
        <p id="delete-error" class="inline-error" role="alert" hidden></p>
        <div class="dialog-actions"><button id="delete-cancel" class="button" type="button">取消</button><button id="delete-confirm" class="button button-danger" type="submit">删除运行</button></div>
      </form>
    </dialog>
    <script type="module" src="/runtime/run-assets/dashboard.js"></script>
  </body>
</html>
