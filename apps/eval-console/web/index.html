<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>评测</title><link rel="stylesheet" href="/console.css"><script src="/console.js" defer></script></head>
<body>
<header class="shell"><a class="brand" href="/" aria-label="评测首页"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h5v14H4M20 5h-5v14h5M7 12h10"/></svg><h1>评测</h1></a><div class="header-actions"><span id="freshness" class="muted"></span><button id="refresh" class="quiet" hidden>刷新</button><button id="logout" class="quiet" hidden>退出</button></div></header>
<main class="shell">
<form id="login" class="login" hidden><h1>评测</h1><label for="password">管理员密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary">登录</button><p id="login-error" role="alert"></p></form>
<div id="app" hidden>
<div class="navigation"><nav aria-label="评测来源"><button data-source="wencai" aria-pressed="true">问财</button><button data-source="aime" aria-pressed="false">AIME</button></nav><select id="preset" aria-label="评测预设"></select></div>
<div class="workspace">
<form id="configuration">
<div id="inputs"></div>
<div class="output-field"><label for="output">评测输出</label><input id="output" required spellcheck="false"></div>
<div class="submit-row"><label for="concurrency">并发</label><input id="concurrency" type="number" min="1" step="1" required><button class="primary" id="preview-button">预览配置 <span aria-hidden="true">↗</span></button></div>
<div class="location"><span>日志位置</span><div id="log-paths"></div></div><p id="config-error" role="alert"></p>
</form>
<div class="side"><section class="tasks" aria-label="评测任务"><span id="task-count" class="sr-only"></span><div id="task-list"><p class="empty">加载中…</p></div><p id="task-error" role="alert"></p></section>
<section class="logs" aria-label="任务日志"><div class="log-toolbar"><select id="log-kind" aria-label="日志类型"><option value="runtime">运行日志</option><option value="evaluation">评测日志</option></select><label class="check"><input type="checkbox" id="errors-only">仅错误</label><button id="older" class="quiet" hidden>更早记录</button><span id="log-task" class="sr-only"></span></div><div id="log-output" class="log-output"><p class="empty">暂无日志</p></div><p id="log-error" role="alert"></p></section></div>
</div></div></main>
<dialog id="preview" aria-label="启动前确认"><form method="dialog" class="dialog-close"><button aria-label="关闭预览" class="quiet">关闭</button></form><div id="preview-summary"></div><div class="dialog-actions"><a id="download">下载配置</a><button id="start" class="primary">开始评测</button></div><p id="start-error" role="alert"></p></dialog>
</body></html>
