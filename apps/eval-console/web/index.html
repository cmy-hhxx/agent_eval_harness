<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>评测工作台</title><link rel="stylesheet" href="/console.css"><script src="/console.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="评测首页"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h5v14H4M20 5h-5v14h5M7 12h10"/></svg><span>评测工作台</span></a><button id="logout" class="text-button" hidden>退出</button></header>
<main>
<form id="login" class="login" hidden><div class="login-title">登录工作台</div><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">登录</button><p id="login-error" role="alert"></p></form>
<div id="app" class="sheet" hidden>
  <div class="title-row"><h1>评测任务</h1><button id="new-task" class="primary"><span aria-hidden="true">＋</span> 新建评测</button></div>
  <div class="toolbar"><nav class="tabs" aria-label="评测来源"><button data-source="wencai" aria-pressed="true">问财<span data-count="wencai">0</span></button><button data-source="aime" aria-pressed="false">AIME<span data-count="aime">0</span></button></nav><div class="refresh-group"><span id="freshness"></span><button id="refresh" class="text-button">刷新</button></div></div>
  <div class="bulk-actions"><label class="check"><input id="select-all" type="checkbox">全选可删除任务</label><span id="selection-count" aria-live="polite">已选 0 项</span><button id="delete-selected" class="text-button delete-task" disabled>批量删除</button></div>
  <p id="task-error" role="alert"></p>
  <div class="table-wrap"><table><thead><tr><th>任务</th><th>状态</th><th>进度</th><th class="num">并发</th><th>创建时间</th><th class="actions-heading">操作</th></tr></thead><tbody id="task-list"></tbody></table></div>
  <div id="empty" class="empty-state" hidden><svg aria-hidden="true" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="5" width="24" height="30" rx="3"/><path d="M14 13h12M14 20h7M14 27h12"/></svg><span>暂无评测任务</span><button id="empty-create" class="text-button">创建第一个任务</button></div>
</div>
</main>
<dialog id="create" class="drawer" aria-labelledby="create-title"><div class="drawer-frame">
  <div class="drawer-header"><span id="create-title">新建评测</span><button id="close-create" class="icon-button" aria-label="关闭新建评测">×</button></div>
  <div class="drawer-body"><form id="configuration">
    <div class="form-row"><div><label for="preset">评测类型</label><select id="preset"></select></div><div class="concurrency-field"><label for="concurrency">并发</label><input id="concurrency" type="number" min="1" step="1" required></div></div>
    <label for="batch-id">缺省批次</label><input id="batch-id" type="text" placeholder="每次新建任务时填写" required aria-describedby="batch-hint"><p id="batch-hint" class="check-meta">原始输入缺少 batch_id 时使用；已有批次保持原值。</p>
    <div class="field-label-row"><label for="input-directory">评测输入父目录</label><button id="choose-input" type="button" class="text-button">选择目录</button></div><textarea id="input-directory" rows="3" spellcheck="false" required></textarea><p id="input-folder-stats" class="check-meta" aria-live="polite"></p>
    <div class="field-label-row"><span>评测输出</span><button id="choose-output" type="button" class="text-button">选择目录</button></div><div id="output-field"></div>
  </form><div id="preview-summary" hidden></div><p id="config-error" role="alert"></p></div>
  <div class="drawer-footer"><a id="download-preview" hidden>下载配置</a><button id="back" hidden>返回修改</button><button id="preview-button" form="configuration" class="primary">Check data</button><button id="start" class="primary" hidden>启动评测</button></div>
</div></dialog>
<dialog id="detail" class="drawer" aria-labelledby="detail-title"><div class="drawer-frame">
  <div class="drawer-header"><span id="detail-title">任务详情</span><button id="close-detail" class="icon-button" aria-label="关闭任务详情">×</button></div>
  <div class="detail-tabs tabs"><button data-detail="logs" aria-pressed="true">日志</button><button data-detail="config" aria-pressed="false">配置</button></div>
  <div class="drawer-body"><div id="logs-panel"><div class="log-toolbar"><select id="log-kind" aria-label="日志类型"><option value="runtime">运行日志</option><option value="evaluation">评测日志</option></select><label class="check"><input type="checkbox" id="errors-only">仅错误</label><button id="refresh-logs" class="text-button">刷新</button></div><div id="log-output"></div><button id="older" hidden>更早记录</button><p id="log-error" role="alert"></p></div><div id="detail-config" hidden></div></div>
  <div class="drawer-footer"><a id="download-task">下载配置</a><button id="close-detail-bottom">关闭</button></div>
</div></dialog>
<dialog id="capacity" class="capacity-dialog" aria-labelledby="capacity-title"><form id="capacity-form"><div class="drawer-header"><span id="capacity-title">调整并发</span><button type="button" id="close-capacity" class="icon-button" aria-label="关闭调整并发">×</button></div><div class="capacity-body"><label for="capacity-value">并发数</label><input id="capacity-value" type="number" min="1" step="1" required><p id="capacity-error" role="alert"></p></div><div class="drawer-footer"><button class="primary" id="apply-capacity">应用</button></div></form></dialog>
<dialog id="folder-picker" class="file-dialog" aria-labelledby="folder-title"><div class="drawer-frame">
  <div class="drawer-header"><span id="folder-title">选择目录</span><button id="close-folder-picker" class="icon-button" aria-label="关闭目录选择">×</button></div>
  <div class="file-controls"><div class="folder-navigation"><button id="folder-back" class="text-button" disabled aria-label="后退">←</button><button id="folder-forward" class="text-button" disabled aria-label="前进">→</button><button id="folder-parent" class="text-button" disabled>上一级</button><button id="folder-roots" class="text-button">根目录</button><button id="folder-reload" class="text-button">刷新</button></div>
    <form id="folder-location-form" class="folder-address"><label for="folder-location" class="sr-only">目录路径</label><input id="folder-location" type="text" spellcheck="false" placeholder="输入完整目录路径后回车"><button type="submit">前往</button></form>
    <nav id="folder-breadcrumbs" class="folder-breadcrumbs" aria-label="当前目录层级"></nav>
    <div class="file-toolbar"><label for="folder-search" class="sr-only">筛选当前目录</label><input id="folder-search" type="search" placeholder="筛选当前文件夹中的名称"><label class="check"><input id="folder-hidden" type="checkbox">显示隐藏项</label><button id="new-folder" type="button">新建文件夹</button></div>
    <form id="new-folder-form" class="new-folder-form" hidden><label for="new-folder-name" class="sr-only">新文件夹名称</label><input id="new-folder-name" placeholder="新文件夹名称" required><button id="create-folder" type="submit">创建</button><button id="cancel-new-folder" type="button" class="text-button">取消</button></form>
  </div>
  <div class="file-content"><p id="folder-error" role="alert"></p><table class="file-table" aria-label="文件和文件夹"><thead><tr><th>名称</th><th>类型</th><th>输入记录</th><th>大小</th></tr></thead><tbody id="folder-list"></tbody></table></div>
  <div class="file-status"><p id="folder-status" aria-live="polite"></p><span>单击选中，双击文件夹进入；仅可选择文件夹。</span></div>
  <div class="file-footer"><div><span>选择的文件夹</span><code id="folder-selected"></code><small id="folder-selection-stats"></small></div><button id="cancel-folder-picker">取消</button><button id="use-folder" class="primary" disabled>选择当前文件夹</button></div>
</div></dialog>
</body></html>
