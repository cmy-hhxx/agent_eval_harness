[project]
name = "prime-eval"
version = "0.1.0"
description = "Auditable pairwise evaluation through local Prime Agent"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
prime-eval = "prime_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pyright>=1.1.400"]

[tool.pyright]
include = ["prime_eval", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
