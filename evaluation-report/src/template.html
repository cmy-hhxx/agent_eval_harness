<!DOCTYPE html>
<html lang="zh-CN" data-standalone="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="美团、AWS、Harbor 等主流评测流程，以及基于开源 Pi 的现有评测方案。">
  <title>Agent 评测体系 · 行业流程与现有方案</title>
  <!-- 样式：共用基础 → 各主题 -->
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="pages/research/styles.css">
  <link rel="stylesheet" href="pages/flow/styles.css">
  <link rel="stylesheet" href="pages/rules/styles.css">
  <link rel="stylesheet" href="pages/prompts/styles.css">
  <link rel="stylesheet" href="pages/architecture/styles.css">
  <link rel="stylesheet" href="pages/experiments/styles.css">
</head>
<body>
  <!-- 页面骨架 -->
  <a class="skip" href="#main">跳到正文</a>
  <header class="header">
    <a class="site-name" href="#research">评测体系</a>
    <nav class="navigation" aria-label="汇报主题">
      <button type="button" data-page="research" aria-current="page">行业对标</button>
      <button type="button" data-page="flow">现有评测方案</button>
      <button type="button" data-page="architecture">Agent 协作</button>
      <button type="button" data-page="rules">判决规则</button>
      <button type="button" data-page="prompts">提示词</button>
      <button type="button" data-page="experiments">实验</button>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <section class="page" id="page-research" aria-label="行业评测流程">
      <div id="researchBody"></div>
    </section>
    <section class="page" id="page-flow" aria-labelledby="flowTitle" hidden>
      <div class="page-heading"><h1 id="flowTitle">现有评测方案</h1></div>
      <div class="pi-evidence">
        <figure>
          <div class="pi-crop pi-crop-website"><img src="assets/pi-website.png" width="3606" height="1654" alt="Pi 官网：Pi is a minimal agent harness. Adapt Pi to your workflows." loading="lazy"></div>
          <figcaption><a href="https://pi.dev/" target="_blank" rel="noopener noreferrer">Pi 官网</a></figcaption>
        </figure>
        <figure>
          <div class="pi-crop pi-crop-github"><img src="assets/pi-github.png" width="3206" height="1678" alt="Pi GitHub 仓库简介：统一 LLM API、Agent 循环、TUI 与 CLI；MIT 许可；截图显示 114.7k Stars。" loading="lazy"></div>
          <figcaption><a href="https://github.com/earendil-works/pi" target="_blank" rel="noopener noreferrer">earendil-works/pi</a></figcaption>
        </figure>
      </div>
      <dl class="pi-summary">
        <div><dt>开源底座 · <a href="https://github.com/earendil-works/pi" target="_blank" rel="noopener noreferrer">Pi</a></dt><dd>提供模型调用、会话和工具执行循环。</dd></div>
        <div><dt>我们做的</dt><dd>把 Pi 任务串成评测流程，编写证据读取、代码复算、结果提交等工具，并完成结果校验与保存。</dd></div>
      </dl>
      <div id="flowBody"></div>
    </section>
    <section class="page" id="page-architecture" aria-labelledby="architectureTitle" hidden>
      <div class="page-heading"><h1 id="architectureTitle">Agent 协作</h1></div>
      <div id="architectureBody"></div>
    </section>
    <section class="page" id="page-rules" aria-labelledby="rulesTitle" hidden>
      <div class="page-heading"><h1 id="rulesTitle">判决规则</h1></div>
      <div id="rulesBody"></div>
    </section>
    <section class="page" id="page-prompts" aria-labelledby="promptsTitle" hidden>
      <div class="page-heading"><h1 id="promptsTitle">评测提示词</h1></div>
      <div id="promptsBody"></div>
    </section>
    <section class="page" id="page-experiments" aria-labelledby="experimentsTitle" hidden>
      <div class="page-heading"><h1 id="experimentsTitle">对比实验</h1></div>
      <div id="experimentsBody"></div>
    </section>
  </main>
  <noscript><p>请启用 JavaScript 以显示报告。</p></noscript>

  <!-- 数据快照：构建时仅压缩 data-snapshot 的 JSON 空白，源码保持易读 -->
  <script id="report-data" src="data/cases.js" data-snapshot></script>
  <script id="report-case-summaries" src="data/case-summaries.js"></script>
  <script id="report-prompt-data" src="data/prompts.js" data-snapshot></script>
  <script id="report-experiment-data" src="data/experiments.js" data-snapshot></script>
  <script id="report-research-data" src="data/research.js" data-snapshot></script>

  <!-- 展示逻辑：共用工具 → 各主题 -->
  <script id="report-motion" src="shared/motion.js"></script>
  <script id="report-icons" src="shared/icons.js"></script>
  <script id="report-answer" src="pages/flow/answer.js"></script>
  <script id="report-details" src="pages/flow/details.js"></script>
  <script id="report-flow" src="pages/flow/index.js"></script>
  <script id="report-rules" src="pages/rules/index.js"></script>
  <script id="report-architecture" src="pages/architecture/index.js"></script>
  <script id="report-experiments" src="pages/experiments/index.js"></script>
  <script id="report-prompts" src="pages/prompts/index.js"></script>
  <script id="report-research-flows" src="pages/research/flows.js"></script>
  <script id="report-research" src="pages/research/index.js"></script>

  <!-- 启动：挂载页面与导航 -->
  <script id="report-app" src="app.js"></script>
</body>
</html>
