# Copy to config.ini. Channel IDs are stable routing identities; keys remain on the server.
# Whole-line # / ; comments. Quote values containing leading/trailing spaces.
[channel.evaluation-gateway]
name = 评测网关
base_url = https://your-gateway.example/v1
api_key =
api = openai-responses
context_window = 524288
max_output_tokens = 32768
traffic_weight = 1
# model = your-gateway-model-id
# Explicit models are a static evaluation catalog; no /models request is needed.
#models = your-gateway-model-id
#efforts = off, low, medium, high
# Enable only when this channel supports prompt_cache_breakpoint / prompt_cache_options.
#supports_explicit_prompt_caching = true

# A second gateway with the same model IDs can share complete evaluation tasks.
[channel.evaluation-gateway-2]
name = 评测网关
base_url = https://your-gateway-2.example/v1
api_key =
api = openai-responses
context_window = 524288
max_output_tokens = 32768
traffic_weight = 1
# models must include every model routed to this channel.
#models = your-gateway-model-id

# Evaluation channels use Responses; Eris retains its separate model selection policy.
# Add any number of channels. Remove or comment an unused section.
#[channel.openai]
#name = OpenAI
#base_url = https://api.openai.com/v1
#api_key =
#api = openai-responses
#traffic_weight = 7

# Self-hosted example: replace the endpoint, model ID and capabilities with your deployment.
# The endpoint must implement Responses; this example does not certify a vendor's public API.
#[channel.self-hosted]
#name = 自部署模型
#base_url = https://your-responses-gateway.example/v1
#api_key =
#api = openai-responses
#model = your-deployed-model-id
#models = your-deployed-model-id
#thinking = high
#efforts = off, high
#supports_developer_role = false
#context_window = 32768
#max_output_tokens = 8192

# Automation channel pool; enable after configuring every listed channel.
# Share complete tasks by traffic_weight; keep each stage's model and parameters.
[automation]
channels = evaluation-gateway, evaluation-gateway-2

# Eris has an independent channel/model binding and uses the channel capabilities.
[agent]
#channel = evaluation-gateway
#model = your-gateway-model-id
#thinking = medium
#context_window = 524288
#max_output_tokens = 8192

# Non-model settings are loaded into the server and child process environment.
[environment]
SEARCH_API_KEY =
AUTOMATIONS_MONGODB_URI =
AUTOMATIONS_MONGODB_TLS_CA_FILE =
# Optional network proxy; always bypass local Host / Worker connections.
#https_proxy = http://127.0.0.1:7897
#http_proxy = http://127.0.0.1:7897
#no_proxy = localhost,127.0.0.1,::1
