# Copy to config.ini. Channel IDs are stable routing identities; keys remain on the server.
# Whole-line # / ; comments. Quote values containing leading/trailing spaces.
[channel.evaluation-gateway]
name = 评测网关
base_url = https://your-gateway.example/v1
api_key =
api = openai-responses
# model = your-gateway-model-id
# Enable only when this channel supports prompt_cache_breakpoint / prompt_cache_options.
#supports_explicit_prompt_caching = true

# Add any number of channels. Remove or comment an unused section.
#[channel.openai]
#name = OpenAI
#base_url = https://api.openai.com/v1
#api_key =
#api = openai-responses

#[channel.deepseek]
#name = DeepSeek
#base_url = https://api.deepseek.com
#api_key =
#api = openai-responses
#model = deepseek-flash
#models = deepseek-flash
#thinking = high
#efforts = off, low, high, max
#supports_developer_role = false
#context_window = 1048576
#max_output_tokens = 8192

# Automation-only channel order; enable after configuring every listed channel.
# Keep each stage's model and parameters; advance only on provider quota/balance exhaustion.
#[automation]
#channels = openai, evaluation-gateway

# Eris exposes GPT Luna models; channel/model/thinking inherit Attribution when omitted.
[agent]
#channel = openai
#model = gpt-6-luna
#thinking = medium
#context_window = 512000
#max_output_tokens = 8192

# Non-model settings are loaded into the server and child process environment.
[environment]
SEARCH_API_KEY =
AUTOMATIONS_MONGODB_URI =
AUTOMATIONS_MONGODB_TLS_CA_FILE =
# Optional network proxy; always bypass local Host / Worker connections.
#https_proxy = http://127.0.0.1:7897
#http_proxy = http://127.0.0.1:7897
#no_proxy = localhost,127.0.0.1,::1
